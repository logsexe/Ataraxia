plugins { id 'com.android.application' }
android {
    namespace 'app.ataraxia.social'
    compileSdk 35
    defaultConfig {
        applicationId 'app.ataraxia.social'
        minSdk 30
        targetSdk 35
        versionCode 5
        versionName '0.1.4-preview'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable false }; release { minifyEnabled false } }
}
