plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def signingNames = ['ATARAXIA_KEYSTORE', 'ATARAXIA_STORE_PASSWORD', 'ATARAXIA_KEY_ALIAS', 'ATARAXIA_KEY_PASSWORD']
def signingReady = signingNames.every { System.getenv(it) }
android {
    namespace 'app.ataraxia.social'
    compileSdk 35
    defaultConfig {
        applicationId 'app.ataraxia.social'
        minSdk 30
        targetSdk 35
        versionCode 15
        versionName '0.2.0-alpha05'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    signingConfigs {
        if (signingReady) {
            persistent {
                storeFile file(System.getenv('ATARAXIA_KEYSTORE'))
                storePassword System.getenv('ATARAXIA_STORE_PASSWORD')
                keyAlias System.getenv('ATARAXIA_KEY_ALIAS')
                keyPassword System.getenv('ATARAXIA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { debuggable false }
        release {
            debuggable false
            minifyEnabled false
            if (signingReady) signingConfig signingConfigs.persistent
        }
    }
}

// Never silently produce an unsigned or test-key release.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!signingReady) throw new GradleException('Release signing is not configured. Set the four ATARAXIA signing environment variables; never commit credentials.')
        }
    }
}


dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
}
