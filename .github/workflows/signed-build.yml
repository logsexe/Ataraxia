name: Manually build with persistent signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-build:
    if: github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate reviewed source before loading signing secrets
        run: |
          python3 tools/privacy_check.py
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/app/ataraxia/social/Policy.java app/src/main/java/app/ataraxia/social/Budget.java tests/PolicyTest.java tests/BudgetTest.java
          java -cp build/tests PolicyTest
          java -cp build/tests BudgetTest
          node tests/filter-regression.test.cjs
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/filter.test.cjs
      - name: Build and verify using protected signing material
        env:
          ATARAXIA_KEYSTORE_BASE64: ${{ secrets.ATARAXIA_KEYSTORE_BASE64 }}
          ATARAXIA_STORE_PASSWORD: ${{ secrets.ATARAXIA_STORE_PASSWORD }}
          ATARAXIA_KEY_ALIAS: ${{ secrets.ATARAXIA_KEY_ALIAS }}
          ATARAXIA_KEY_PASSWORD: ${{ secrets.ATARAXIA_KEY_PASSWORD }}
          ATARAXIA_CERT_SHA256: ${{ secrets.ATARAXIA_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in ATARAXIA_KEYSTORE_BASE64 ATARAXIA_STORE_PASSWORD ATARAXIA_KEY_ALIAS ATARAXIA_KEY_PASSWORD ATARAXIA_CERT_SHA256; do
            if [ -z "${!variable}" ]; then echo "Missing signing configuration: $variable"; exit 1; fi
          done
          export ATARAXIA_KEYSTORE="$RUNNER_TEMP/ataraxia-signing.keystore"
          trap 'rm -f "$ATARAXIA_KEYSTORE"' EXIT
          umask 077
          python3 - <<'PY'
          import base64,os,pathlib
          pathlib.Path(os.environ['ATARAXIA_KEYSTORE']).write_bytes(base64.b64decode(os.environ['ATARAXIA_KEYSTORE_BASE64'],validate=True))
          PY
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Ataraxia-signed-candidate.apk
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk_tools/apksigner" verify --verbose --print-certs dist/Ataraxia-signed-candidate.apk > dist/SIGNATURE.txt
          "$sdk_tools/zipalign" -c -p 4 dist/Ataraxia-signed-candidate.apk
          "$sdk_tools/aapt" dump badging dist/Ataraxia-signed-candidate.apk > dist/manifest.txt
          python3 - <<'PY'
          import os,re,pathlib
          sig=pathlib.Path('dist/SIGNATURE.txt').read_text()
          actual=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',sig).group(1)
          expected=os.environ['ATARAXIA_CERT_SHA256'].replace(':','').strip().lower()
          assert actual==expected,'Unexpected signing certificate'
          text=pathlib.Path('dist/manifest.txt').read_text()
          assert "package: name='app.ataraxia.social'" in text
          assert 'application-debuggable' not in text
          assert [line for line in text.splitlines() if line.startswith('uses-permission:')]==["uses-permission: name='android.permission.INTERNET'"]
          PY
          cp build/privacy-review.json dist/privacy-review.json
          cd dist
          sha256sum Ataraxia-signed-candidate.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ataraxia-signed-candidate
          path: dist/*
          if-no-files-found: error
