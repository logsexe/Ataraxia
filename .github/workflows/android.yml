name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test policy and session limits
        run: |
          mkdir -p build/tests
          javac -d build/tests \
            app/src/main/java/app/ataraxia/social/Policy.java \
            app/src/main/java/app/ataraxia/social/Budget.java \
            tests/PolicyTest.java tests/BudgetTest.java
          java -cp build/tests PolicyTest
          java -cp build/tests BudgetTest
      - name: Check filter syntax
        run: node --check app/src/main/assets/filter.js
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
