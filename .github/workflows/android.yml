name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read version (gradle.properties is the single source)
        id: version
        run: |
          name=$(grep '^ATARAXIA_VERSION_NAME=' gradle.properties | cut -d= -f2)
          code=$(grep '^ATARAXIA_VERSION_CODE=' gradle.properties | cut -d= -f2)
          test -n "$name" && test -n "$code"
          echo "version=$name" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Privacy and philosophy regression checks
        run: |
          python3 tools/privacy_check.py
          python3 tests/philosophy_source_test.py
          python3 tests/ui_source_test.py
      - name: Test policy and session limits
        run: |
          mkdir -p build/tests
          javac -d build/tests \
            app/src/main/java/app/ataraxia/social/Policy.java \
            app/src/main/java/app/ataraxia/social/Budget.java \
            app/src/main/java/app/ataraxia/social/SettingsBackup.java \
            tests/PolicyTest.java tests/BudgetTest.java tests/SettingsBackupTest.java
          java -cp build/tests PolicyTest
          java -cp build/tests BudgetTest
          java -cp build/tests SettingsBackupTest
      - name: Test basic filters and scroll stability
        run: |
          node --check app/src/main/assets/filter.js
          node tests/filter-regression.test.cjs
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/filter.test.cjs
          node tests/feed-stability.test.cjs
      - name: Missing persistent signing must fail closed
        run: |
          mkdir -p build
          if ./gradlew --no-daemon :app:preReleaseBuild > build/signing-guard.log 2>&1; then
            echo 'Release unexpectedly accepted missing signing configuration'
            exit 1
          fi
          python3 - <<'PYTEST'
          from pathlib import Path
          assert 'Release signing is not configured' in Path('build/signing-guard.log').read_text()
          PYTEST
      - name: Build non-debuggable pilot APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK signature, identity and permissions
        run: |
          mkdir -p dist
          cp build/privacy-review.json dist/privacy-review.json
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Ataraxia-$VERSION_NAME.apk"
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk_tools/apksigner" verify --verbose --print-certs dist/Ataraxia-$VERSION_NAME.apk > dist/SIGNATURE.txt
          "$sdk_tools/zipalign" -c -p 4 dist/Ataraxia-$VERSION_NAME.apk
          "$sdk_tools/aapt" dump badging dist/Ataraxia-$VERSION_NAME.apk > dist/manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          apk_name=f"dist/Ataraxia-{os.environ['VERSION_NAME']}.apk"
          with ZipFile(apk_name) as apk:
              rules = apk.read('assets/filter.js')
              assert rules == Path('app/src/main/assets/filter.js').read_bytes()
              assert b'countPosts' not in rules
              assert not any('experiments/' in name or 'filter-alpha10' in name for name in apk.namelist())
          text = Path('dist/manifest.txt').read_text()
          expected=f"package: name='app.ataraxia.social' versionCode='{os.environ['VERSION_CODE']}' versionName='{os.environ['VERSION_NAME']}'"
          assert expected in text, text.splitlines()[0]
          permissions = [line for line in text.splitlines() if line.startswith('uses-permission:')]
          assert permissions == ["uses-permission: name='android.permission.INTERNET'"], permissions
          assert 'application-debuggable' not in text
          print('Verified identity, version, Internet-only permissions and non-debuggable manifest')
          PY
          cd dist
          sha256sum Ataraxia-$VERSION_NAME.apk > SHA256SUMS.txt
      - name: Upload verified pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: Ataraxia-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
